# Covers every shape the fetch types branch on. Used by the type tests (via test/types/petstore.ts) and generator tests.
openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
tags:
  - name: pets
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: all pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: showPetById
      responses:
        '200':
          description: one pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deletePet
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: deleted
  /pets/{petId}/photo:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPetPhoto
      responses:
        '200':
          description: photo
          content:
            image/png:
              schema:
                type: string
                format: binary
  /owners/{ownerId}/pets/{petId}:
    parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: integer
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOwnerPet
      responses:
        '200':
          description: pet of owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /search:
    get:
      operationId: searchPets
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pet'
  /status:
    post:
      operationId: postStatus
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '202':
          description: accepted
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued:
                    type: boolean
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        tag:
          type: string
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
